<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Family Hub · Wall Display</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="tablet-hub.webmanifest">
  <meta name="theme-color" content="#1B1625">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    /* ---------- Page-specific layout only — colours/fonts come from shared.css ----------
       This page deliberately doesn't use shared.css's .wrap (which caps width for the
       reading-width dashboard pages) — a wall-mounted tablet wants the tiles filling the
       screen, not a narrow centred column. */

    html, body { height: 100%; }
    body { margin: 0; }

    .hub-shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: clamp(16px, 2.5vw, 36px) clamp(16px, 3vw, 44px);
    }

    .hub-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .hub-topbar .back-link { font-size: 0.85rem; }
    .fullscreen-btn {
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg);
      border-radius: 999px; padding: 6px 14px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
    }
    .fullscreen-btn:hover { background: var(--surface-sunken); }

    .hub-header { margin: 4px 0 18px; }
    .hub-header .subtitle { font-size: clamp(0.85rem, 1.1vw, 1rem); }
    .hub-header h1 { font-size: clamp(1.4rem, 2.6vw, 2.1rem); margin: 2px 0 0; }

    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 1fr;
      gap: clamp(12px, 1.6vw, 22px);
    }
    @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    .tile {
      background: var(--surface); border: 1px solid var(--border); border-top: 4px solid var(--c, var(--r-blue));
      border-radius: 18px; padding: clamp(16px, 1.8vw, 26px); text-align: left; cursor: pointer; color: var(--fg); font: inherit;
      display: flex; flex-direction: column; justify-content: center; gap: 10px; position: relative;
    }
    .tile:hover { background: var(--surface-sunken); }
    .tile.wide { grid-column: span 2; }
    .tile[data-tile="wifi"]     { --c: var(--r-red); }
    .tile[data-tile="calendar"] { --c: var(--r-orange); }
    .tile[data-tile="chore"]    { --c: var(--r-yellow); }
    .tile[data-tile="meal"]     { --c: var(--r-green); }
    .tile[data-tile="heating"]  { --c: var(--r-blue); }
    .tile-head { display: flex; align-items: center; gap: 10px; }
    .tile-icon { font-size: clamp(1.3rem, 2vw, 1.8rem); }
    .tile[data-tile="wifi"] .tile-icon { font-size: clamp(0.8rem, 1vw, 1rem); }
    .tile-label { font-family: var(--font-display); font-weight: 700; font-size: clamp(1rem, 1.4vw, 1.25rem); }
    .tile-preview { font-size: clamp(0.82rem, 1.1vw, 1rem); color: var(--muted); }
    .needs-setup {
      position: absolute; top: 14px; right: 14px; font-size: 0.62rem; letter-spacing: 0.04em; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; background: var(--r-orange); color: #fff;
    }
    .status-badge {
      display: inline-block; align-self: flex-start; font-size: 0.62rem; letter-spacing: 0.04em; font-weight: 700;
      padding: 2px 8px; border-radius: 999px; background: var(--r-red); color: #fff; margin-top: 2px;
    }

    .bin-bar {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--r-indigo);
      border-radius: 12px; padding: 10px 16px; margin-bottom: clamp(12px, 1.6vw, 20px);
      cursor: pointer; text-align: left; font: inherit; color: var(--fg);
    }
    .bin-bar:hover { background: var(--surface-sunken); }
    .bin-bar .bin-icon { font-size: clamp(0.8rem, 1vw, 1rem); flex-shrink: 0; }
    .bin-bar .bin-text { font-size: clamp(0.82rem, 1vw, 0.95rem); }
    .bin-bar .bin-text strong { font-family: var(--font-display); }
    .bin-bar .bin-warn { margin-left: auto; font-size: 0.7rem; color: var(--r-orange); font-weight: 700; flex-shrink: 0; }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 500; }
    .modal { background: var(--surface); border-radius: 18px; padding: 22px; max-width: 480px; width: 100%; max-height: 86vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    .modal.wide { max-width: 920px; }
    .modal .modal-title {
      font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; text-align: center; padding: 12px;
      color: #fff; border-radius: 16px 16px 0 0; margin: -22px -22px 16px -22px; background: var(--rainbow);
    }
    .modal-close { float: right; margin-top: -40px; background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer; }
    .modal-frame { border: 0; width: 100%; border-radius: 10px; }

    .qr-output { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .qr-output canvas { border-radius: 10px; }

    .mode-row { display: flex; gap: 8px; }
    .mode-pill {
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted);
      border-radius: 999px; padding: 8px 16px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .mode-pill.active { color: #fff; border-color: transparent; }
    .mode-pill.active[data-mode="Heat"] { background: var(--r-orange); }
    .mode-pill.active[data-mode="Eco"]  { background: var(--r-green); }
    .mode-pill.active[data-mode="Off"]  { background: var(--muted); }
    .temp-row { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
    .temp-row button {
      width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--border-strong);
      background: var(--surface-sunken); color: var(--fg); font-size: 1.1rem; cursor: pointer;
    }
    .temp-label { text-align: center; min-width: 76px; }
    .temp-label .num { font-family: var(--font-display); font-weight: 700; font-size: 1.8rem; color: var(--r-orange); }
    .temp-label .unit-label { font-size: 0.68rem; letter-spacing: 0.04em; color: var(--muted); }

    .chore-group h3 { font-family: var(--font-display); margin: 12px 0 6px; }
    .chore-group ul { list-style: none; padding: 0; margin: 0; }
    .chore-group li button {
      margin: 4px 0; padding: 0.55rem 1rem; font: 600 0.9rem inherit;
      border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); color: var(--fg); cursor: pointer;
    }
    .chore-group li button:hover { background: var(--surface-sunken); }
  </style>
</head>
<body>
<div class="hub-shell">
  <div class="hub-topbar">
    <a href="index.html?home=benton" class="back-link">⬅ Back to Dashboard</a>
    <button class="fullscreen-btn" id="fullscreenBtn">⛶ Full screen</button>
  </div>
  <header class="hub-header">
    <div class="rainbow-rule"></div>
    <div class="titlebar">
      <div>
        <h1><span>Family Hub · Wall Display</span></h1>
        <div class="subtitle">A separate page for the kitchen tablet — the main dashboard is untouched</div>
      </div>
    </div>
  </header>

  <button class="bin-bar" id="binBar"></button>

  <div class="grid" id="tileGrid"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modalInner"></div>
</div>

<div class="toast" id="toast"></div>

<button class="toggle-mode" id="modeToggle">🌙</button>

<script>
/* ========== Theme — same "theme" key as index/meal-plan, so it stays in sync ========== */
const modeBtn = document.getElementById('modeToggle');
function setInitialTheme(){
  const stored = localStorage.getItem('theme');
  const dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.body.classList.toggle('dark', dark);
  modeBtn.textContent = dark ? '☀️' : '🌙';
  modeBtn.classList.toggle('sun', dark);
}
modeBtn.onclick = () => {
  const dark = !document.body.classList.contains('dark');
  document.body.classList.toggle('dark', dark);
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  modeBtn.textContent = dark ? '☀️' : '🌙';
  modeBtn.classList.toggle('sun', dark);
};
setInitialTheme();

/* ========== Full screen ==========
   Browsers only allow entering full screen from a real tap (no auto-launch on load),
   so this button is the immediate fix regardless of how the page was opened.
   For a true chrome-less launch (no address bar at all), see the note sent alongside
   this file about re-adding the page to the home screen now that it has a manifest. */
const fsBtn = document.getElementById('fullscreenBtn');
function isFullscreen(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function updateFsLabel(){ fsBtn.textContent = isFullscreen() ? '⛶ Exit full screen' : '⛶ Full screen'; }
fsBtn.onclick = () => {
  if (isFullscreen()) {
    (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
  } else {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
  }
};
document.addEventListener('fullscreenchange', updateFsLabel);
document.addEventListener('webkitfullscreenchange', updateFsLabel);
// If launched from the home-screen icon (manifest display:fullscreen/standalone), hide the button — there's no browser chrome to escape from.
if (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches) {
  fsBtn.style.display = 'none';
}

/* ========== Quietly recover lost full screen on the very next tap ==========
   This tablet runs on battery most of the time, woken up occasionally rather than
   kept permanently on — so forcing the screen to stay on (a wake lock) would just
   burn through charge for no benefit. The actual annoyance is that whatever tap
   wakes the tablet doesn't also restore full screen, so you're left looking at
   browser chrome until you find and press the button again.
   Browsers only grant full screen from a real tap, but they don't care which
   element was tapped — so this makes EVERY tap on the page re-request full screen
   if it isn't already active. The tap that wakes the tablet and lands anywhere on
   the dashboard quietly puts it back into full screen, with nothing extra to do. */
document.addEventListener('click', () => {
  if (!isFullscreen()) {
    const el = document.documentElement;
    (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
  }
}, true);
</script>

<script>
(function () {
  "use strict";

  // ---------- Toast ----------
  var toastTimer = null;
  function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
  }

  // ---------- Modal ----------
  function openModal(html, wide) {
    var el = document.getElementById('modalInner');
    el.className = 'modal' + (wide ? ' wide' : '');
    el.innerHTML = '<button class="modal-close" id="modalCloseBtn" aria-label="Close">&times;</button>' + html;
    document.getElementById('overlay').hidden = false;
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  }
  function closeModal() {
    document.getElementById('overlay').hidden = true;
    document.getElementById('modalInner').innerHTML = '';
  }
  document.getElementById('overlay').addEventListener('click', function (e) { if (e.target === this) closeModal(); });

  // ---------- Heating (Nest) — live via the Apps Script endpoints added to the same backend ----------
  var heating = { mode: 'OFF', ecoMode: 'OFF', target: null, current: null, hvacStatus: '', connectivity: '', loaded: false };

  function heatingPreview() {
    if (!heating.loaded) return 'Tap to open';
    if (heating.current == null) return 'Unavailable right now';
    return heating.current.toFixed(1) + '°C' + (heating.target != null ? ' → ' + heating.target.toFixed(1) + '°C' : '');
  }

  function fetchNestStatus(cb) {
    var cfg = window.config || {};
    if (!cfg.summaryUrl) { cb && cb(false); return; }
    var sep = cfg.summaryUrl.indexOf('?') >= 0 ? '&' : '?';
    fetch(cfg.summaryUrl + sep + 'feed=nestStatus&ts=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && data.ok) {
          heating.mode = data.mode || 'OFF';
          heating.ecoMode = data.ecoMode || 'OFF';
          heating.target = typeof data.heatSetpointCelsius === 'number' ? data.heatSetpointCelsius : null;
          heating.current = typeof data.ambientTempCelsius === 'number' ? data.ambientTempCelsius : null;
          heating.hvacStatus = data.hvacStatus || '';
          heating.connectivity = data.connectivity || '';
        }
        heating.loaded = true;
        cb && cb(!!(data && data.ok));
      })
      .catch(function () { heating.loaded = true; cb && cb(false); });
  }

  function openHeatingModal() {
    openModal(
      '<div class="modal-title">🔥 Heating · Nest</div>' +
      '<div class="mode-row">' +
        '<button class="mode-pill" data-mode="HEAT">Heat</button>' +
        '<button class="mode-pill" data-mode="OFF">Off</button>' +
      '</div>' +
      '<label style="display:flex;align-items:center;gap:8px;margin-top:14px;font-size:0.85rem;color:var(--muted);">' +
        '<input type="checkbox" id="ecoToggle"> Eco mode' +
      '</label>' +
      '<div class="temp-row">' +
        '<button id="decTemp" aria-label="Lower target">&minus;</button>' +
        '<div class="temp-label"><div class="unit-label">TARGET</div><div class="num" id="targetNum">--</div></div>' +
        '<button id="incTemp" aria-label="Raise target">+</button>' +
      '</div>' +
      '<p style="color:var(--muted);font-size:0.85rem;margin-top:14px;" id="currentTempLine">Loading current reading…</p>'
    );
    document.querySelectorAll('.mode-pill').forEach(function (btn) {
      btn.addEventListener('click', function () { setHeatingMode(btn.dataset.mode); });
    });
    document.getElementById('ecoToggle').addEventListener('change', function (e) { setHeatingEco(e.target.checked); });
    document.getElementById('incTemp').addEventListener('click', function () { if (heating.target != null) setHeatingTarget(Math.min(25, heating.target + 0.5)); });
    document.getElementById('decTemp').addEventListener('click', function () { if (heating.target != null) setHeatingTarget(Math.max(9, heating.target - 0.5)); });
    fetchNestStatus(function () { refreshHeatingModal(); renderTiles(); });
  }

  function refreshHeatingModal() {
    var targetEl = document.getElementById('targetNum');
    if (!targetEl) return; // modal already closed by the time a fetch resolves
    targetEl.textContent = heating.target != null ? heating.target.toFixed(1) + '°C' : '--';
    document.querySelectorAll('.mode-pill').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.mode === heating.mode);
    });
    var ecoBox = document.getElementById('ecoToggle');
    if (ecoBox) ecoBox.checked = heating.ecoMode === 'MANUAL_ECO';
    var currentEl = document.getElementById('currentTempLine');
    if (currentEl) {
      currentEl.textContent = heating.current != null
        ? 'Current ' + heating.current.toFixed(1) + '°C · ' + (heating.hvacStatus || '')
        : 'Could not read the thermostat right now.';
    }
  }

  function postNestAction(params) {
    var cfg = window.config || {};
    if (!cfg.choreSubmitUrl) { showToast('choreSubmitUrl isn’t set in config.js'); return; }
    var body = new URLSearchParams(params);
    fetch(cfg.choreSubmitUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() })
      .catch(function () {})
      .then(function () {
        // no-cors means we can't read the response, so re-fetch real state shortly after to confirm what actually happened
        setTimeout(function () { fetchNestStatus(function () { refreshHeatingModal(); renderTiles(); }); }, 1500);
      });
  }
  function setHeatingMode(mode) {
    heating.mode = mode; // optimistic UI update, corrected by the re-fetch above
    refreshHeatingModal();
    postNestAction({ action: 'nestSetMode', mode: mode });
  }
  function setHeatingEco(on) {
    heating.ecoMode = on ? 'MANUAL_ECO' : 'OFF';
    refreshHeatingModal();
    postNestAction({ action: 'nestSetEco', mode: on ? 'MANUAL_ECO' : 'OFF' });
  }
  function setHeatingTarget(target) {
    heating.target = target; // optimistic
    refreshHeatingModal();
    postNestAction({ action: 'nestSetTemp', tempCelsius: target });
  }

  // ---------- Wi-Fi QR — real, using the same QRious + config.js as the main dashboard ----------
  function openWifiModal() {
    var cfg = window.config || {};
    if (!cfg.wifiName) {
      openModal('<div class="modal-title">📶 Wi-Fi QR Code</div><p style="color:var(--muted);">wifiName / wifiPassword aren’t set in config.js.</p>');
      return;
    }
    openModal(
      '<div class="modal-title">📶 Wi-Fi QR Code</div>' +
      '<div class="qr-output"><canvas id="qrcode"></canvas><div>Network: ' + cfg.wifiName + '</div></div>'
    );
    new QRious({
      element: document.getElementById('qrcode'),
      size: 220,
      value: 'WIFI:S:' + cfg.wifiName + ';T:WPA;P:' + cfg.wifiPassword + ';;'
    });
  }

  // ---------- Calendar — real embed, same as the main dashboard, plus headline events for the tile/modal ----------
  // Needs a `feed=calendarEvents` endpoint added to the Apps Script backend (see the note sent
  // alongside this file) — until that's added, calEvents.loaded stays false and the preview
  // just falls back to "Family calendar" as before, same as it always did.
  var calEvents = { loaded: false, items: [] };
  function fetchCalendarEvents(cb) {
    var cfg = window.config || {};
    if (!cfg.summaryUrl || !cfg.calendarEmail) { cb && cb(false); return; }
    var sep = cfg.summaryUrl.indexOf('?') >= 0 ? '&' : '?';
    fetch(cfg.summaryUrl + sep + 'feed=calendarEvents&calendarId=' + encodeURIComponent(cfg.calendarEmail) + '&ts=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (data) {
        calEvents.items = (data && data.ok && Array.isArray(data.events)) ? data.events : [];
        calEvents.loaded = true;
        cb && cb(!!(data && data.ok));
      })
      .catch(function () { calEvents.loaded = true; cb && cb(false); });
  }
  function calendarPreview() {
    if (!calEvents.loaded || !calEvents.items.length) return 'Family calendar';
    var e = calEvents.items[0];
    var when = new Date(e.start).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    return 'Next: ' + e.title + ' (' + when + ')';
  }
  function openCalendarModal() {
    var cfg = window.config || {};
    if (!cfg.calendarEmail) {
      openModal('<div class="modal-title">📅 Family Calendar</div><p style="color:var(--muted);">calendarEmail isn’t set in config.js.</p>');
      return;
    }
    var src = encodeURIComponent(cfg.calendarEmail);
    var headlineHtml = '';
    if (calEvents.loaded && calEvents.items.length) {
      headlineHtml = '<div style="margin-bottom:12px;">' +
        calEvents.items.slice(0, 5).map(function (e) {
          var when = new Date(e.start).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
          return '<div style="padding:6px 0;border-bottom:1px solid var(--border);"><strong>' + when + '</strong> — ' + e.title + '</div>';
        }).join('') +
      '</div>';
    }
    openModal(
      '<div class="modal-title">📅 Family Calendar</div>' +
      headlineHtml +
      '<iframe class="modal-frame" style="height:600px;" frameborder="0" scrolling="no" ' +
      'src="https://calendar.google.com/calendar/embed?height=600&wkst=1&bgcolor=%23ffffff&ctz=Europe/London&showTitle=0&showNav=1&mode=AGENDA&src=' + src + '"></iframe>',
      true
    );
  }

  // ---------- Meal Plan — the real page, full-featured, just popped out instead of navigated to ----------
  // Headline preview reuses meal-plan.html's own feed=mealplan endpoint (nothing new needed
  // in the Apps Script backend — this one's already there).
  var DAY_ORDER_TH = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']; // matches JS Date#getDay() (0=Sun)
  var mealToday = { loaded: false, label: null };
  function mondayOfTH(date) {
    var d = new Date(date);
    var dow = d.getDay();
    var diff = dow === 0 ? -6 : 1 - dow;
    d.setDate(d.getDate() + diff);
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function toISODateTH(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fetchMealToday(cb) {
    var cfg = window.config || {};
    if (!cfg.mealPlanUrl) { cb && cb(false); return; }
    var base = String(cfg.mealPlanUrl).split('#')[0].split('?')[0];
    var monday = mondayOfTH(new Date());
    fetch(base + '?feed=mealplan&weekStart=' + toISODateTH(monday) + '&t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var days = (data && Array.isArray(data.days)) ? data.days : [];
        var todayKey = DAY_ORDER_TH[new Date().getDay()]; // 'Mon'..'Sun'
        var entry = days.find(function (d) { return d.day === todayKey; });
        if (entry && entry.recipe) mealToday.label = entry.recipe.name;
        else if (entry && entry.customText) mealToday.label = entry.customText;
        else mealToday.label = null;
        mealToday.loaded = true;
        cb && cb(true);
      })
      .catch(function () { mealToday.loaded = true; cb && cb(false); });
  }
  function mealPreview() {
    if (!mealToday.loaded) return 'Opens the full planner';
    return mealToday.label ? 'Tonight: ' + mealToday.label : 'Nothing planned for tonight yet';
  }
  function openMealModal() {
    openModal(
      '<div class="modal-title">🍽️ Meal Plan</div>' +
      '<iframe class="modal-frame" style="height:80vh;" frameborder="0" src="meal-plan.html?home=benton"></iframe>',
      true
    );
  }

  // ---------- Bins — Colchester City Council collection calendar for 32 East Street, CO1 2TP ----------
  // Collection day is always Thursday. Food waste is collected every week.
  // Mixed recycling + glass alternate fortnightly with non-recyclable rubbish.
  // Anchor: Thursday 19 Nov 2026 was a Recycling & Glass week (confirmed from the council's PDF calendar).
  // Taken from the council's calendar covering 19 Nov 2026 – 13 May 2027 — after that, re-check
  // colchester.gov.uk/your-recycling-calendar in case the pattern or day changes (e.g. Christmas shifts).
  var BIN_RECYCLING_ANCHOR = new Date(2026, 10, 19); // 19 Nov 2026, a Thursday
  var BIN_CALENDAR_VALID_UNTIL = new Date(2027, 4, 13); // last date confirmed on the current PDF

  function nextThursdayOnOrAfter(date) {
    var d = new Date(date);
    d.setHours(0, 0, 0, 0);
    var day = d.getDay(); // 0=Sun..6=Sat, Thursday=4
    var diff = (4 - day + 7) % 7;
    d.setDate(d.getDate() + diff);
    return d;
  }
  function binWeekType(thursdayDate) {
    var msPerWeek = 7 * 24 * 60 * 60 * 1000;
    var diffWeeks = Math.round((thursdayDate - BIN_RECYCLING_ANCHOR) / msPerWeek);
    var parity = ((diffWeeks % 2) + 2) % 2;
    return parity === 0 ? 'recycling' : 'rubbish';
  }
  function formatBinDate(d) {
    return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  }
  function nextBinCollection() {
    var today = new Date();
    var thu = nextThursdayOnOrAfter(today);
    var isToday = thu.toDateString() === new Date(today.getFullYear(), today.getMonth(), today.getDate()).toDateString();
    return {
      date: thu,
      isToday: isToday,
      type: binWeekType(thu),
      pastKnownCalendar: thu > BIN_CALENDAR_VALID_UNTIL
    };
  }
  function binsPreview() {
    var info = nextBinCollection();
    var label = info.type === 'recycling' ? 'Recycling & Glass' : 'Rubbish';
    return (info.isToday ? 'Today' : formatBinDate(info.date)) + ' — ' + label;
  }
  function openBinsModal() {
    var info = nextBinCollection();
    var label = info.type === 'recycling' ? '♻️ Recycling & Glass' : '🗑️ Rubbish';
    var afterThu = new Date(info.date);
    afterThu.setDate(afterThu.getDate() + 7);
    var afterLabel = binWeekType(afterThu) === 'recycling' ? '♻️ Recycling & Glass' : '🗑️ Rubbish';
    openModal(
      '<div class="modal-title">🗑️ Bin Day</div>' +
      '<p style="text-align:center;font-size:1rem;margin:4px 0;">' + (info.isToday ? 'Today' : formatBinDate(info.date)) + '</p>' +
      '<p style="text-align:center;font-weight:700;font-size:1.3rem;margin:0 0 14px;">' + label + '</p>' +
      '<p style="color:var(--muted);font-size:0.85rem;text-align:center;">Food waste is collected every week too.</p>' +
      '<p style="color:var(--muted);font-size:0.82rem;text-align:center;margin-top:10px;">Following week (' + formatBinDate(afterThu) + '): ' + afterLabel + '</p>' +
      (info.pastKnownCalendar ?
        '<p style="color:var(--r-orange);font-size:0.8rem;text-align:center;margin-top:12px;">⚠️ This is beyond the last council calendar we checked (valid to 13 May 2027) — worth confirming nothing\'s changed.</p>'
        : '') +
      '<p style="text-align:center;margin-top:14px;"><a href="https://www.colchester.gov.uk/your-recycling-calendar" target="_blank" rel="noopener" style="font-size:0.82rem;">Check the official council calendar ↗</a></p>'
    );
  }

  // ---------- Chores — same logic as the main dashboard, same endpoint ----------
  var CHORES = {
    "Robin": ["Tidy Room", "Empty/Refill Dishwasher", "Set the Table", "Help with the Washing", "House Cleaning", "Other"],
    "Méabh": ["Tidy Room", "Empty/Refill Dishwasher", "Set the Table", "Help with the Washing", "House Cleaning", "Other"]
  };
  function openChoreModal() {
    var html = '<div class="modal-title">🧽 Log a Chore</div>';
    Object.keys(CHORES).forEach(function (name) {
      html += '<div class="chore-group"><h3>' + name + '</h3><ul>' +
        CHORES[name].map(function (chore) {
          return '<li><button data-child="' + name + '" data-chore="' + chore + '">' + chore + '</button></li>';
        }).join('') + '</ul></div>';
    });
    openModal(html);
    document.querySelectorAll('.chore-group button').forEach(function (btn) {
      btn.addEventListener('click', function () { submitChore(btn.dataset.child, btn.dataset.chore); });
    });
  }
  function submitChore(child, chore) {
    var cfg = window.config || {};
    if (!cfg.choreSubmitUrl) { showToast('choreSubmitUrl isn’t set in config.js'); return; }
    var body = new URLSearchParams();
    body.set('child', child); body.set('chore', chore); body.set('ts', Date.now());
    fetch(cfg.choreSubmitUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() }).catch(function () {});
    showToast(chore + ' logged for ' + child);
    closeModal();
  }

  // ---------- Tile grid ----------
  var TILES = [
    { id: 'wifi',     icon: '📶', label: 'Wi-Fi QR',  open: openWifiModal,     preview: function () { return 'Tap to show'; }, needsSetup: function () { return !(window.config && window.config.wifiName); } },
    { id: 'calendar', icon: '📅', label: 'Calendar',  open: openCalendarModal, preview: calendarPreview, needsSetup: function () { return !(window.config && window.config.calendarEmail); } },
    { id: 'chore',    icon: '🧽', label: 'Chores',    open: openChoreModal,    preview: function () { return 'Tap to log'; }, needsSetup: function () { return !(window.config && window.config.choreSubmitUrl); } },
    { id: 'meal',     icon: '🍽️', label: 'Meal Plan', open: openMealModal,     preview: mealPreview,   wide: true, needsSetup: function () { return !(window.config && window.config.mealPlanUrl); } },
    { id: 'heating',  icon: '🔥', label: 'Heating',   open: openHeatingModal,  preview: heatingPreview, needsSetup: function () { return heating.loaded && heating.current == null; }, badge: function () { return heating.hvacStatus === 'HEATING' ? '🔥 On' : ''; } }
  ];
  function renderTiles() {
    var grid = document.getElementById('tileGrid');
    grid.innerHTML = '';
    TILES.forEach(function (t) {
      var btn = document.createElement('button');
      btn.className = 'tile' + (t.wide ? ' wide' : '');
      btn.setAttribute('data-tile', t.id);
      var badgeText = t.badge ? t.badge() : '';
      btn.innerHTML =
        (t.needsSetup() ? '<span class="needs-setup">SET UP</span>' : '') +
        '<div class="tile-head"><span class="tile-icon">' + t.icon + '</span><span class="tile-label">' + t.label + '</span></div>' +
        '<div class="tile-preview">' + t.preview() + '</div>' +
        (badgeText ? '<span class="status-badge">' + badgeText + '</span>' : '');
      btn.addEventListener('click', t.open);
      grid.appendChild(btn);
    });
  }

  function renderBinBar() {
    var info = nextBinCollection();
    var label = info.type === 'recycling' ? '♻️ Recycling &amp; Glass' : '🗑️ Rubbish';
    var when = info.isToday ? 'Today' : formatBinDate(info.date);
    var bar = document.getElementById('binBar');
    bar.innerHTML =
      '<span class="bin-icon">🗑️</span>' +
      '<span class="bin-text"><strong>' + when + '</strong> — ' + label + ' (plus food waste)</span>' +
      (info.pastKnownCalendar ? '<span class="bin-warn">⚠️ check calendar</span>' : '');
    bar.onclick = openBinsModal;
  }

  renderTiles();
  renderBinBar();
  fetchNestStatus(function () { renderTiles(); }); // get real heating data on load, not just when the tile is tapped
  fetchCalendarEvents(function () { renderTiles(); });
  fetchMealToday(function () { renderTiles(); });
  setInterval(function () { fetchNestStatus(function () { renderTiles(); refreshHeatingModal(); }); }, 5 * 60 * 1000); // keep it fresh every 5 minutes
  setInterval(function () { fetchCalendarEvents(function () { renderTiles(); }); }, 30 * 60 * 1000); // every 30 min — events don't change that often
  setInterval(function () { fetchMealToday(function () { renderTiles(); }); }, 30 * 60 * 1000);
  setInterval(renderBinBar, 60 * 60 * 1000); // refresh at the hour boundary so it rolls over to "Today" / the next date correctly
})();
</script>
</body>
</html>
