<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Family Life Dashboard</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    details summary { font-weight: 700; cursor: pointer; font-size: 1.05rem; }
    details[open] summary { margin-bottom: 0.9rem; }
    section.surface { margin-bottom: 16px; }

    ul { list-style: none; padding: 0; margin: 0; }
    li button {
      margin: 4px 0; padding: 0.55rem 1rem; font: 600 0.95rem inherit; border: 1px solid var(--border-strong);
      border-radius: 999px; background: var(--surface-sunken); color: var(--fg); cursor: pointer;
    }
    li button:hover { background: var(--border); }

    .qr-output { margin-top: 0.75rem; }
    .qr-output canvas { border-radius: 10px; }

    .chore-summary { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 4px; }
    .chore-summary > div { flex: 1 1 220px; }
    .chore-summary h3 { font-family: var(--font-display); margin-bottom: 0.4rem; }
    .earnings-badge { display: inline-block; min-width: 3em; text-align: right; font-weight: 800; color: #fff; border-radius: 6px; padding: 2px 8px; }
    .badge-green { background: var(--r-green); } .badge-yellow { background: var(--r-yellow); }
    .badge-orange { background: var(--r-orange); } .badge-grey { background: var(--muted); }
    .progress-bar { background: var(--surface-sunken); border-radius: 10px; overflow: hidden; margin-top: 0.5rem; height: 16px; }
    .progress-fill { height: 100%; background: var(--rainbow); width: 0%; transition: width 0.5s ease; }

    /* Confirmation modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(20,16,28,.55); z-index: 1000; align-items: center; justify-content: center; }
    .modal .content { background: var(--surface); color: var(--fg); padding: 22px; border-radius: 16px; width: 90%; max-width: 400px; box-shadow: 0 10px 28px rgba(0,0,0,.25); }
    .modal .title {
      font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; text-align: center; padding: 10px 12px; color: var(--on-fg);
      border-radius: 10px; margin: -22px -22px 16px -22px; background: var(--fg);
    }
    .modal .actions { margin-top: 14px; display: flex; gap: 10px; justify-content: flex-end; }
  </style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="rainbow-rule"></div>
    <div class="titlebar">
      <div>
        <h1><span>Family Life Dashboard</span></h1>
        <div class="subtitle">Everything the Bentons need in one place</div>
      </div>
    </div>
  </header>

  <section class="surface">
    <details id="wifiSection">
      <summary>📶 Show Wi-Fi QR Code</summary>
      <div class="qr-output"><canvas id="qrcode"></canvas></div>
    </details>
  </section>

  <section class="surface">
    <details data-role="chore-logger">
      <summary>🧽 Log a Chore</summary>
      <div id="choreLinks"></div>
    </details>
  </section>

  <section class="surface">
    <details open>
      <summary>📈 Weekly Chore Summary</summary>
      <div class="chore-summary" id="summaryContainer">Loading…</div>
    </details>
  </section>

  <section class="surface">
    <details open>
      <summary>✏️ Spellings Practice</summary>
      <p><button class="add-btn" onclick="window.location.href='spellings.html?home=benton'">Open Spellings Page</button></p>
    </details>
  </section>

  <section class="surface">
    <details open>
      <summary>📚 Robin's Book Chart</summary>
      <p><button class="add-btn" onclick="window.location.href='book-chart.html?home=benton'">Open Book Chart</button></p>
    </details>
  </section>

  <section class="surface">
    <details>
      <summary>📅 Family Calendar</summary>
      <iframe id="calendarFrame" style="border:0;width:100%;height:400px;border-radius:10px;margin-top:0.5rem" frameborder="0" scrolling="no"></iframe>
    </details>
  </section>
</div>

<button class="toggle-mode" id="modeToggle">🌙</button>

<!-- Confirmation Modal -->
<div class="modal" id="choreConfirm">
  <div class="content">
    <div class="title">Confirm Chore</div>
    <p id="confirmText"></p>
    <div class="actions">
      <button class="pill-btn" id="cancelBtn">Cancel</button>
      <button class="add-btn" id="submitBtn">Yes, submit</button>
    </div>
  </div>
</div>

<script>
/* ========== Theme ========== */
const modeBtn = document.getElementById('modeToggle');
function setInitialTheme(){
  const stored = localStorage.getItem('theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = stored ? stored === 'dark' : prefersDark;
  document.body.classList.toggle('dark', dark);
  modeBtn.textContent = dark ? '☀️' : '🌙';
  modeBtn.classList.toggle('sun', dark);
}
modeBtn.onclick = () => {
  const dark = !document.body.classList.contains('dark');
  document.body.classList.toggle('dark', dark);
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  modeBtn.textContent = dark ? '☀️' : '🌙';
  modeBtn.classList.toggle('sun', dark);
};

/* ========== QR + Calendar ========== */
function initQR(){
  new QRious({
    element: document.getElementById('qrcode'),
    size: 200,
    value: `WIFI:S:${window.config.wifiName};T:WPA;P:${window.config.wifiPassword};;`
  });
  if (!localStorage.getItem('seenQR')){
    document.getElementById('wifiSection').setAttribute('open','');
    localStorage.setItem('seenQR','1');
  }
}
function initCalendar(){
  const src = encodeURIComponent(window.config.calendarEmail);
  document.getElementById('calendarFrame').src =
    `https://calendar.google.com/calendar/embed?height=400&wkst=1&bgcolor=%23ffffff&ctz=Europe/London&showTitle=0&showNav=1&mode=AGENDA&src=${src}`;
}

/* ========== Chores UI ========== */
const CHORES = {
  "Robin": ["Tidy Room","Empty/Refill Dishwasher","Set the Table","Help with the Washing","House Cleaning","Other"],
  "Méabh": ["Tidy Room","Empty/Refill Dishwasher","Set the Table","Help with the Washing","House Cleaning","Other"]
};
function renderChoreButtons(){
  const wrap = document.getElementById('choreLinks');
  wrap.innerHTML = '';
  Object.keys(CHORES).forEach(name => {
    const group = document.createElement('div');
    group.innerHTML = `<h3>${name}</h3>`;
    const ul = document.createElement('ul');
    CHORES[name].forEach(chore => {
      const li = document.createElement('li');
      const btn = document.createElement('button');
      btn.textContent = chore;
      btn.onclick = () => openConfirm(name, chore);
      li.appendChild(btn); ul.appendChild(li);
    });
    group.appendChild(ul);
    wrap.appendChild(group);
  });
}

/* ========== Confirm + Submit ========== */
let pending = { child: '', chore: '' };
const modal = document.getElementById('choreConfirm');
const cancelBtn = document.getElementById('cancelBtn');
const submitBtn = document.getElementById('submitBtn');

cancelBtn.onclick = () => { modal.style.display='none'; pending={child:'', chore:''}; };
submitBtn.onclick = submitChore;

function openConfirm(name, chore){
  pending.child = name;
  pending.chore = chore;
  document.getElementById('confirmText').textContent = `Did ${name} complete: “${chore}”?`;
  modal.style.display = 'flex';
}

function submitChore(){
  if (!pending.child || !pending.chore) return;

  // Post as x-www-form-urlencoded → avoids preflight/CORS
  const body = new URLSearchParams();
  body.set('child', pending.child);
  body.set('chore', pending.chore);
  body.set('ts', Date.now());

  fetch(window.config.choreSubmitUrl, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: body.toString()
  }).catch(()=>{}); // best-effort; the summary reload will show result

  // Collapse the “Log a Chore” panel after submitting
  const logger = document.querySelector('details[data-role="chore-logger"]');
  if (logger) logger.removeAttribute('open');

  // Close the modal
  modal.style.display = 'none';

  // Refresh the summary section after a brief delay
  setTimeout(loadSummary, 700);
}

/* ========== Summary fetch (cache-busted + key normaliser) ========== */
function normalizeData(raw){
  // Rebuild a clean object with NFC-normalised keys and numeric coercion
  const out = {};
  for (const [k, v] of Object.entries(raw || {})) {
    const keyN = String(k).normalize('NFC');
    let mapped = keyN;
    if (keyN === 'Meabh') mapped = 'Méabh';
    if (keyN.toLowerCase() === 'robin') mapped = 'Robin';
    out[mapped] = {
      ...(v || {}),
      count: Number((v && v.count) != null ? v.count : 0),
      weekly: Number((v && v.weekly) != null ? v.weekly : 0),
      total: Number((v && v.total) != null ? v.total : 0),
      goalAmount: Number((v && v.goalAmount) != null ? v.goalAmount : 0),
      goal: (v && v.goal) ? v.goal : ''
    };
  }
  return out;
}

function getSummaryUrl(){
  // Strip any existing query/hash then add a timestamp cache-buster
  const base = (window.config && window.config.summaryUrl) ? String(window.config.summaryUrl) : '';
  const clean = base.split('#')[0].split('?')[0];
  return `${clean}?t=${Date.now()}`;
}

function loadSummary(){
  const el = document.getElementById('summaryContainer');
  el.textContent = 'Loading…';

  const url = getSummaryUrl();
  console.log('[Summary] Fetch:', url);

  fetch(url, { cache: 'no-store' })
    .then(r => { console.log('[Summary] HTTP', r.status); return r.json(); })
    .then(raw => {
      console.log('[Summary] Raw JSON:', raw);
      const data = normalizeData(raw); console.log('[Summary] Normalised Méabh:', data['Méabh']);

      // Expected shape: { Robin:{count,weekly,total,goal,goalAmount}, Méabh:{...} }
      el.innerHTML = '';
      Object.entries(data).forEach(([name, person]) => {
        if (!person) return;
        const id = name === 'Robin' ? 'robin' : 'meabh';
        const weekly = Number(person.weekly||0);
        const total  = Number(person.total||0);
        const goal   = person.goal || '';
        const goalAmt= Number(person.goalAmount||0);

        const card = document.createElement('div');
        card.innerHTML = `
          <h3>${name}</h3>
          <p>Chores completed this week: <strong id="${id}Count">${person.count ?? 0}</strong></p>
          <p>Weekly earnings: £<span id="${id}Earnings" class="earnings-badge">${weekly.toFixed(2)}</span></p>
          <p>🎯 Goal: <span>${goal || "—"}</span> (£<span>${goalAmt ? goalAmt.toFixed(2) : "—"}</span>)</p>
          <div class="progress-bar"><div id="${id}Goal" class="progress-fill"></div></div>
          <p>Total so far: £<strong id="${id}Total">${total.toFixed(2)}</strong></p>
        `;
        el.appendChild(card);

        // Colour the weekly badge
        const badge = card.querySelector(`#${id}Earnings`);
        badge.classList.remove('badge-green','badge-yellow','badge-orange','badge-grey');
        if (weekly >= 5) badge.classList.add('badge-green');
        else if (weekly === 3) badge.classList.add('badge-yellow');
        else if (weekly === 1) badge.classList.add('badge-orange');
        else badge.classList.add('badge-grey');

        // Progress towards goal
        const fill = card.querySelector(`#${id}Goal`);
        const progress = (goalAmt > 0) ? Math.min((total/goalAmt)*100, 100) : 0;
        fill.style.width = `${progress}%`;

        if (weekly >= 5) confetti();
      });

      // Minimal inline debug to keep while we sort this
      const rob = data['Robin']?.count ?? 0;
      const mea = data['Méabh']?.count ?? 0;
      console.log(`[Summary] Rendered counts → Robin: ${rob}, Méabh: ${mea}`);
    })
    .catch(err => {
      console.error('[Summary] Error:', err);
      el.textContent = 'Could not load summary.';
    });
}

/* ========== Boot ========== */
window.addEventListener('load', () => {
  setInitialTheme();
  initQR();
  initCalendar();
  renderChoreButtons();
  loadSummary();
});
</script>
</body>
</html>
